name: Validate Live Implementation

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Base URL of the live implementation to validate'
        required: true
        type: string
        default: 'https://api-stg.opencitations.net/skg-if/v1/'
      spec_version:
        description: 'Spec version folder to validate against (openapi/ver/<spec_version>)'
        required: false
        type: string
        default: 'current'

jobs:
  discover:
    runs-on: ubuntu-latest
    name: Discover live endpoints to check
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx pyyaml

      - name: List collection endpoints
        id: list
        env:
          SPEC_VERSION: ${{ inputs.spec_version }}
        run: |
          set -euo pipefail
          MATRIX=$(python .github/scripts/validate_live_url.py list-endpoints "openapi/ver/${SPEC_VERSION}/skg-if-openapi.yaml")
          echo "Matrix: $MATRIX"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  validate:
    needs: discover
    runs-on: ubuntu-latest
    name: "Validate GET ${{ matrix.path }}"
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.discover.outputs.matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx pyyaml

      - name: Validate endpoint
        env:
          TARGET_URL: ${{ inputs.target_url }}
          SPEC_VERSION: ${{ inputs.spec_version }}
        run: |
          python .github/scripts/validate_live_url.py check "openapi/ver/${SPEC_VERSION}/skg-if-openapi.yaml" "$TARGET_URL" "${{ matrix.path }}"
