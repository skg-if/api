name: Validate Live Implementation

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Base URL of the live implementation to validate'
        required: true
        type: string
        default: 'https://api-stg.opencitations.net/skg-if/v1/'
      spec_version:
        description: 'Spec version folder to validate against (openapi/ver/<spec_version>)'
        required: false
        type: string
        default: 'current'

jobs:
  validate_live_implementation:
    runs-on: ubuntu-latest
    name: Validate Live Implementation

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx pyyaml

      - name: Validate live implementation
        env:
          TARGET_URL: ${{ inputs.target_url }}
          SPEC_VERSION: ${{ inputs.spec_version }}
        run: |
          python .github/scripts/validate_live_url.py "openapi/ver/${SPEC_VERSION}/skg-if-openapi.yaml" "$TARGET_URL"
