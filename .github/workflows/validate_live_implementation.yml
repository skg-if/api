name: Validate SKG-IF Live impl. (manual workflow)

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Base URL of the live implementation to validate'
        required: true
        type: string
        default: 'https://api-stg.opencitations.net/skg-if/v1/'
      spec_version:
        description: 'Spec version folder to validate against (openapi/ver/<spec_version>)'
        required: false
        type: string
        default: 'current'
      exclude_endpoints:
        description: 'Comma-separated list of endpoint paths to exclude from validation, e.g. /venues,/topics'
        required: false
        type: string
        default: '/venues,/topics'

jobs:
  discover:
    runs-on: ubuntu-latest
    name: Discover SKG-IF OpenAPI specs endpoints to check
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
      domain: ${{ steps.domain.outputs.domain }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx pyyaml

      - name: List collection endpoints
        id: list
        env:
          SPEC_VERSION: ${{ inputs.spec_version }}
          EXCLUDE_ENDPOINTS: ${{ inputs.exclude_endpoints }}
        run: |
          set -euo pipefail
          MATRIX=$(python .github/scripts/validate_live_url.py list-endpoints "openapi/ver/${SPEC_VERSION}/skg-if-openapi.yaml" --exclude "$EXCLUDE_ENDPOINTS")
          echo "Matrix: $MATRIX"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

      - name: Compute target domain
        id: domain
        env:
          TARGET_URL: ${{ inputs.target_url }}
        run: |
          set -euo pipefail
          DOMAIN=$(echo "$TARGET_URL" | sed -E 's#^[a-zA-Z]+://##; s#/.*##')
          echo "Domain: $DOMAIN"
          echo "domain=$DOMAIN" >> "$GITHUB_OUTPUT"

  validate:
    needs: discover
    runs-on: ubuntu-latest
    name: "Validate ${{ needs.discover.outputs.domain }} GET ${{ matrix.path }}"
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.discover.outputs.matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx pyyaml

      - name: Validate endpoint
        env:
          TARGET_URL: ${{ inputs.target_url }}
          SPEC_VERSION: ${{ inputs.spec_version }}
        run: |
          python .github/scripts/validate_live_url.py check "openapi/ver/${SPEC_VERSION}/skg-if-openapi.yaml" "$TARGET_URL" "${{ matrix.path }}"

  validate_product_by_id:
    needs: discover
    runs-on: ubuntu-latest
    name: "Validate ${{ needs.discover.outputs.domain }} GET /products/{local_identifier}"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx pyyaml

      - name: Validate product-by-id chain
        env:
          TARGET_URL: ${{ inputs.target_url }}
          SPEC_VERSION: ${{ inputs.spec_version }}
          EXCLUDE_ENDPOINTS: ${{ inputs.exclude_endpoints }}
        run: |
          python .github/scripts/validate_live_url.py check-product-by-id "openapi/ver/${SPEC_VERSION}/skg-if-openapi.yaml" "$TARGET_URL" --exclude "$EXCLUDE_ENDPOINTS"
